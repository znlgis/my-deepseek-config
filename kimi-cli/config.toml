# Kimi CLI × DeepSeek 配置
# 复制为 ~/.kimi/config.toml（Kimi CLI 也会在 /login 后自动写入此文件）。
# 把 api_key 替换为真实 DeepSeek Key，切勿把含真实 Key 的文件提交进仓库。

default_model = "deepseek-v4-flash"
default_thinking = false
default_yolo = false
default_plan_mode = false
theme = "dark"
show_thinking_stream = true

# DeepSeek 走 OpenAI Chat Completions 兼容协议。
[providers.deepseek]
type = "openai_legacy"
base_url = "https://api.deepseek.com/v1"
api_key = "sk-your-deepseek-key"

# 轻量模型（Flash / 快速）：探索、检索、简单编辑、通用问答。
[models.deepseek-v4-flash]
provider = "deepseek"
model = "deepseek-v4-flash"
max_context_size = 131072
capabilities = []
display_name = "DeepSeek V4 Flash"

# 主模型（Pro / 强推理）：规划、架构、根因分析、代码审查、重型实现。
[models.deepseek-v4-pro]
provider = "deepseek"
model = "deepseek-v4-pro"
max_context_size = 131072
capabilities = ["always_thinking"]
display_name = "DeepSeek V4 Pro"

[loop_control]
max_steps_per_turn = 1000
max_retries_per_step = 3
reserved_context_size = 50000
compaction_trigger_ratio = 0.85

[background]
max_running_tasks = 4
keep_alive_on_exit = false
agent_task_timeout_s = 900

[[hooks]]
event = "PostToolUse"
matcher = "WriteFile|StrReplaceFile"
command = "echo 'File written successfully'"
timeout = 10
